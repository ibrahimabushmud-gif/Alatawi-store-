<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إتمام الطلب - متجر العطاوي</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap');
    body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- هيدر صفحة الدفع -->
  <header class="bg-white shadow-sm border-b border-gray-100 py-4 mb-8">
    <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-2">
        <div class="bg-purple-900 text-white p-2 rounded-xl font-black text-lg tracking-wider">العطاوي</div>
        <span class="text-xs bg-purple-100 text-purple-800 px-2 py-1 rounded-full font-bold">إتمام الطلب الآمن</span>
      </a>
      <a href="index.html" class="text-sm font-bold text-purple-900 hover:underline"><i class="fa-solid fa-arrow-right ml-1"></i> العودة للمتجر</a>
    </div>
  </header>

  <!-- محتوى صفحة إتمام الطلب (مطابق لتصميم العطاوي) -->
  <main class="max-w-7xl mx-auto px-4 pb-12 grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
    
    <!-- القسم الأيمن: ملخص الطلب والمنتجات -->
    <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
      <h3 class="font-black text-base text-gray-900 mb-4 pb-2 border-b flex justify-between items-center">
        <span>ملخص الطلب</span>
        <span id="checkout-item-count" class="text-xs bg-purple-100 text-purple-900 px-2.5 py-1 rounded-full font-bold">0 عناصر</span>
      </h3>
      
      <!-- قائمة المنتجات المصغرة داخل ملخص الطلب -->
      <div id="checkout-products-list" class="space-y-3 mb-6 max-h-60 overflow-y-auto divide-y divide-gray-50">
        <!-- يتم تعبئتها ديناميكياً -->
      </div>

      <!-- إدخال كوبون الخصم -->
      <div class="mb-6">
        <label class="block text-xs font-bold text-gray-600 mb-1.5">بطاقة هدية أو رمز الخصم</label>
        <div class="flex gap-2">
          <input type="text" placeholder="استبدل هنا" class="flex-1 bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-purple-600" />
          <button onclick="alert('رمز الخصم غير متاح حالياً')" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold px-4 py-2 rounded-xl text-xs transition">تطبيق</button>
        </div>
      </div>

      <!-- حساب الأسعار -->
      <div class="space-y-2.5 text-sm mb-6 pt-4 border-t border-gray-100">
        <div class="flex justify-between text-gray-600">
          <span>المجموع الفرعي:</span>
          <span id="sub-total" class="font-bold text-gray-900">0 ريال</span>
        </div>
        <div class="flex justify-between text-gray-600">
          <span>ضريبة القيمة المضافة (15%):</span>
          <span id="vat-tax" class="font-bold text-gray-900">0 ريال</span>
        </div>
        <div class="flex justify-between text-gray-900 font-black text-base pt-3 border-t">
          <span>المجموع (شامل الضريبة):</span>
          <span id="grand-total" class="text-purple-900">0 ريال</span>
        </div>
      </div>
      
      <p class="text-[11px] text-gray-400 text-center">سياسة الاستبدال والاسترجاع مضمونة 100%</p>
    </div>

    <!-- القسم الأيسر: معلومات التواصل والتوصيل والدفع -->
    <div class="lg:col-span-2 space-y-6">
      
      <!-- معلومات التواصل -->
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
        <div class="flex justify-between items-center mb-4 pb-2 border-b">
          <h2 class="font-black text-base text-gray-900 flex items-center gap-2">
            <span class="bg-emerald-100 text-emerald-700 w-6 h-6 rounded-full flex items-center justify-center text-xs"><i class="fa-solid fa-check"></i></span> معلومات التواصل
          </h2>
        </div>
        <p class="text-xs text-gray-500 mb-4">مرحباً بعودتك، إبراهيم!</p>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <input type="text" value="إبراهيم طارق" class="bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm outline-none" readonly />
          <input type="tel" value="+970 592152484" class="bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm outline-none" readonly />
        </div>
      </div>

      <!-- التوصيل -->
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
        <h2 class="font-black text-base text-gray-900 mb-4 pb-2 border-b flex items-center gap-2">
          <span class="bg-purple-100 text-purple-900 w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold">2</span> التوصيل
        </h2>
        <div class="space-y-3">
          <input type="text" placeholder="أدخل عنوان الشحن التفصيلي (المدينة، الحي، الشارع)" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm outline-none focus:border-purple-600" />
        </div>
      </div>

      <!-- الدفع -->
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
        <h2 class="font-black text-base text-gray-900 mb-4 pb-2 border-b flex items-center gap-2">
          <span class="bg-purple-100 text-purple-900 w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold">3</span> الدفع
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-6">
          <button class="border-2 border-purple-900 bg-purple-50/50 rounded-xl p-4 flex flex-col items-center justify-center font-bold text-sm text-purple-900">
            <i class="fa-solid fa-credit-card text-xl mb-1"></i> مدى / أبل باي
          </button>
          <button class="border border-gray-200 hover:border-gray-300 rounded-xl p-4 flex flex-col items-center justify-center font-bold text-sm text-gray-700">
            <i class="fa-solid fa-wallet text-xl mb-1 text-teal-600"></i> تابي / تمارا
          </button>
          <button class="border border-gray-200 hover:border-gray-300 rounded-xl p-4 flex flex-col items-center justify-center font-bold text-sm text-gray-700">
            <i class="fa-solid fa-money-bill-wave text-xl mb-1 text-amber-600"></i> عند الاستلام
          </button>
        </div>

        <button onclick="alert('تم إتمام الطلب بنجاح! شكراً لتسوقك معنا.'); window.location.href='index.html';" class="w-full bg-purple-900 hover:bg-purple-800 text-white font-bold py-4 rounded-xl transition shadow-lg text-center block text-base cursor-pointer">
          تأكيد وإتمام الطلب الآن
        </button>
      </div>

    </div>

  </main>

  <script>
    // محاكاة جلب المنتجات لملخص الطلب (في حال تم الربط المباشر)
    window.onload = function() {
      const listContainer = document.getElementById('checkout-products-list');
      // بيانات تجريبية مطابقة للصورة تماماً
      listContainer.innerHTML = `
        <div class="flex items-center gap-3 py-2">
          <img src="https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=300" class="w-12 h-12 object-cover rounded-xl bg-gray-50" />
          <div class="flex-1">
            <h4 class="font-bold text-xs text-gray-900 line-clamp-1">كفر حماية للأيفون أكس وولف وضمان سنة</h4>
            <span class="text-xs text-gray-500">الكمية: 1</span>
          </div>
          <span class="font-black text-xs text-purple-900">159.00 ريال</span>
        </div>
        <div class="flex items-center gap-3 py-2">
          <img src="https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=300" class="w-12 h-12 object-cover rounded-xl bg-gray-50" />
          <div class="flex-1">
            <h4 class="font-bold text-xs text-gray-900 line-clamp-1">سماعات لاسلكية FreeClip 2.5</h4>
            <span class="text-xs text-gray-500">الكمية: 3</span>
          </div>
          <span class="font-black text-xs text-purple-900">749.00 ريال</span>
        </div>
      `;
      document.getElementById('checkout-item-count').innerText = "4 عناصر";
      document.getElementById('sub-total').innerText = "2,092.17 ريال";
      document.getElementById('vat-tax').innerText = "313.83 ريال";
      document.getElementById('grand-total').innerText = "2,406.00 ريال";
    };
  </script>

</body>
</html>
